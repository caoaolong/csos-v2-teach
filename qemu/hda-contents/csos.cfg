# csos.cfg - grub.cfg-style boot config
# ESP root (qemu/hda-contents/csos.cfg -> L"\\csos.cfg").
# Kernel parses it (src/kernel/config.c) and applies it at boot.

# 1. Physical memory allocator (default bitmap)
pmm=bitmap

# 2. Disk backend (default ata-pio)
disk=ata-pio

# 3. Mounts (fstab-style: <src> <mountpoint> <fstype>)
root=hd2p0
mount hd2p0 / fat32
mount hd3p0 /data ext4

# First user program (smoke test reads this file)
init=/data/usr/local/bin/gcc

# 4. Misc
debug=serial
timeout=3
